name: allur-twin

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    logging: *logging
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: allur
      POSTGRES_USER: allur
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets: [database_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U allur -d allur"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    image: allur-twin-api:2.0.0
    logging: *logging
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: runtime
    environment:
      DATABASE_PASSWORD_FILE: /run/secrets/database_password
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
      AI_MODEL: ${AI_MODEL:-qwen3:4b}
      MONITORING_AI_ENABLED: ${MONITORING_AI_ENABLED:-true}
      PHYSICAL_CONTROL_ENABLED: ${PHYSICAL_CONTROL_ENABLED:-false}
      TZ: Asia/Qyzylorda
    networks: [default, inference]
    secrets: [database_password, bootstrap_password]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 2g
    pids_limit: 150
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    init: true

  web:
    image: allur-twin-web:2.0.0
    logging: *logging
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777", "/var/cache/nginx:size=64m,mode=1777"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "127.0.0.1:${PORT:-8088}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 10s
      timeout: 4s
      retries: 5
    restart: unless-stopped

  backup:
    image: postgres:17.6-alpine
    logging: *logging
    command: [sh, /backup.sh]
    secrets: [database_password]
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, "test -n \"$$(find /backups -maxdepth 1 -name last-success -mmin -420)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 60s

  ollama:
    profiles: [ai]
    image: ollama/ollama@sha256:292ee7945dfc3d5840a181f3ab86fedb1e66703e02c8af98b50f4da56b7e278c
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
    volumes:
      - ollama_models:/root/.ollama
    networks: [inference]
    mem_limit: 8g
    cpus: 6
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped
    healthcheck:
      test: [CMD, ollama, list]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: test
    environment:
      DATABASE_URL: "sqlite:///:memory:"
      RUNNER_ENABLED: "false"
      BOOTSTRAP_PASSWORD: "Test bootstrap phrase 2026!"
    volumes:
      - ./gateway:/gateway:ro
      - ./samples:/samples:ro
      - ./backend/app:/app/app:ro
      - ./backend/tests:/app/tests:ro

  e2e:
    profiles: [test]
    build:
      context: .
      dockerfile: docker/e2e.Dockerfile
    environment:
      BASE_URL: http://web:8080
      BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
    secrets: [bootstrap_password]
    depends_on:
      web:
        condition: service_healthy
    ipc: host
    volumes:
      - ./samples:/samples:ro
      - ./e2e/tests:/tests/tests:ro
      - ./e2e/global-setup.ts:/tests/global-setup.ts:ro
      - ./e2e/playwright.config.ts:/tests/playwright.config.ts:ro
      - ./e2e/results:/tests/test-results
      - ./e2e/playwright-report:/tests/playwright-report

volumes:
  postgres_data:
  ollama_models:

networks:
  default:
  inference:
    internal: true

secrets:
  database_password:
    file: ./.secrets/database_password
  bootstrap_password:
    file: ./.secrets/bootstrap_password
