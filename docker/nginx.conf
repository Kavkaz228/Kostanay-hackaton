limit_req_zone $binary_remote_addr zone=login:10m rate=10r/s;
log_format timings escape=json '{"path":"$uri","status":$status,"duration":"$request_time","upstream_connect":"$upstream_connect_time","upstream_header":"$upstream_header_time","upstream_response":"$upstream_response_time","request_id":"$upstream_http_x_request_id"}';
upstream allur_api {
    zone allur_api 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server api:8000 resolve;
    keepalive 16;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    send_timeout 30s;
    access_log /dev/stdout timings;
    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1024;

    include /etc/nginx/security-headers.conf;

    location = /api/auth/login {
        limit_req zone=login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://allur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /api/ {
        proxy_pass http://allur_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 180s;
    }

    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
